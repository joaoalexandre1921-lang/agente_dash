name: Atualizar notícias

on:
  schedule:
    # No GitHub Free, repositórios privados têm uma franquia mensal de minutos.
    # Uma execução por hora representa cerca de 720 execuções/mês e tende a
    # caber na franquia de 2.000 minutos se cada job permanecer curto; 15 em 15
    # minutos seriam ~2.880 execuções. Para mais frequência, use um proxy/Worker.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar feeds
        run: node scripts/fetch-news.mjs
      - name: Publicar somente quando houver mudança
        run: |
          if git diff --quiet -- public/news.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git commit -m "Atualizar notícias do dashboard"
          git push
