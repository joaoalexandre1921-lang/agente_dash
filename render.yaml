services:
  - type: web
    name: mapa-empresas-dashboard
    runtime: static
    buildCommand: mkdir -p dist && cp index.html dist/index.html && cp public/news.json dist/news.json && cp public/assistant.css public/assistant.js dist/
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /news.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
  - type: web
    name: mapa-empresas-assistente
    runtime: node
    plan: free
    buildCommand: echo "Assistente pronto"
    startCommand: node assistant-server.mjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: LUSHA_API_KEY
        sync: false
      - key: LUSHA_DEBUG
        value: "0"
      - key: ALLOWED_ORIGINS
        value: https://mapa-empresas-dashboard.onrender.com
